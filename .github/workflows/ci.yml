name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      qualify_clips:
        description: Measure the staged reaction video sources and retain a qualification artifact
        type: boolean
        default: false
      verify_gallery:
        description: Run the real responsive gallery and video export browser workflow
        type: boolean
        default: false

jobs:
  gallery-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_gallery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser verification tools
        run: |
          python -m pip install playwright==1.61.0
          if ! command -v google-chrome >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg
          fi
      - name: Verify gallery creation and exported video
        run: python3 tests/gallery_browser.py .fleet-local/gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-browser-evidence
          retention-days: 7
          path: .fleet-local/gallery/
  qualify-clips:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_clips
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install media inspection tools
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg
          fi
      - name: Qualify reaction clips
        run: python3 scripts/qualify-clip-library.py --limit 1500 --probe-cache expansion/sources/gallery-clips-probes.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-gallery-clips
          retention-days: 7
          path: .fleet-local/clip-quality/
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:landing
      - run: pnpm run check
      - run: pnpm test
      - name: Build exact-source production package
        run: |
          pnpm run build:public
          ./node_modules/.bin/wrangler deploy --dry-run --outdir .release/worker
          git rev-parse HEAD > .release/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-package-${{ github.sha }}
          include-hidden-files: true
          retention-days: 7
          path: |
            .release/
            worker/public/
            wrangler.jsonc
